[project]
name = "scpo-connect-services"
version = "0.1.0"
description = "APIs modulares demonstrativas do SCPO Connect"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "cryptography>=43,<50",
  "fastapi>=0.115,<0.120",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
