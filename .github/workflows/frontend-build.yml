name: Frontend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify all mobile app entries and manifests
        run: test -s dist/nursing.html && test -s dist/nursing.webmanifest && test -s dist/operations.html && test -s dist/operations.webmanifest && test -s dist/pharmacy.html && test -s dist/pharmacy.webmanifest
